<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ev. Gemeindehaus Hessisch Lichtenau</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#f5f0e8}

body{
  font-family:'Lato',sans-serif;
  background: radial-gradient(ellipse at 20% 0%, #f5e6d0 0%, #ede8dc 40%, #dfe8d6 100%);
}

.page{
  width:100vw;height:100vh;
  display:grid;
  grid-template-columns:55% 45%;
  position:relative;
  overflow:hidden;
}

/* Dekorative Blätter oben links */
.leaf-tl{
  position:absolute;top:-20px;left:-20px;
  width:280px;opacity:0.55;
  z-index:5;pointer-events:none;
}
/* Dekorative Blätter unten rechts */
.leaf-br{
  position:absolute;bottom:-20px;right:-10px;
  width:220px;opacity:0.45;
  z-index:5;pointer-events:none;
  transform:rotate(180deg) scaleX(-1);
}

/* Sanfte Kreisform im Hintergrund rechts */
.bg-circle{
  position:absolute;
  top:-10%;right:-5%;
  width:75vh;height:75vh;
  background:radial-gradient(circle, rgba(245,230,200,0.55) 0%, transparent 70%);
  border-radius:50%;
  z-index:0;pointer-events:none;
}
.bg-circle2{
  position:absolute;
  bottom:-15%;left:35%;
  width:65vh;height:65vh;
  background:radial-gradient(circle, rgba(200,220,190,0.35) 0%, transparent 70%);
  border-radius:50%;
  z-index:0;pointer-events:none;
}

/* ===== LINKE SEITE ===== */
.left{
  position:relative;
  display:flex;flex-direction:column;
  justify-content:space-between;
  padding:5vh 3vw 4vh 4vw;
  z-index:10;
}

.branding{
  position:relative;z-index:10;
}

.herzlich{
  font-family:'Dancing Script',cursive;
  font-size:clamp(52px, 7vw, 96px);
  color:#4a5e35;
  line-height:1;
  margin-bottom:0px;
  text-shadow:1px 2px 8px rgba(74,94,53,0.12);
}

.heart-icon{
  position:absolute;
  top:-18px;right:20px;
  font-size:clamp(24px,3vw,40px);
  color:#b08850;
  opacity:0.85;
}

.willkommen{
  font-family:'Playfair Display',serif;
  font-size:clamp(64px, 9.5vw, 148px);
  font-weight:700;
  color:#2c2c2c;
  line-height:0.9;
  letter-spacing:-2px;
  text-transform:uppercase;
}

.sub1{
  font-family:'Lato',sans-serif;
  font-size:clamp(18px,2.2vw,32px);
  color:#555;
  font-weight:300;
  margin-top:10px;
  letter-spacing:1px;
}

.sub2{
  font-family:'Dancing Script',cursive;
  font-size:clamp(22px,2.8vw,42px);
  color:#4a5e35;
  margin-top:6px;
  letter-spacing:1px;
}

/* Gebäude-Bild */
.building-wrap{
  position:absolute;
  bottom:0; left:-20px;
  width:92%;
  z-index:4;
}

.building-wrap img{
  width:100%;
  display:block;
  filter:drop-shadow(0 10px 30px rgba(0,0,0,0.12));
}

/* ===== RECHTE SEITE ===== */
.right{
  position:relative;
  display:flex;flex-direction:column;
  justify-content:flex-start;
  padding:5vh 4vw 4vh 2vw;
  gap:3vh;
  z-index:10;
}

/* Zeit-Box */
.time-card{
  display:flex;
  align-items:center;
  gap:2vw;
  padding:2.5vh 2vw;
  border-radius:20px;
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.9);
  box-shadow:0 4px 30px rgba(0,0,0,0.06);
}

.clock-icon{
  flex-shrink:0;
}
.clock-svg{width:clamp(48px,5vw,78px);height:clamp(48px,5vw,78px)}
.clock-circle{stroke:#4a5e35;stroke-width:2.5;fill:none}
.clock-hands{stroke:#4a5e35;stroke-width:2.5;stroke-linecap:round}

.divider-v{
  width:1.5px;height:60%;
  background:linear-gradient(to bottom, transparent, #b8a87a, transparent);
  align-self:stretch;
  margin:10px 0;
}

.time-text{}
.time-display{
  font-family:'Lato',sans-serif;
  font-size:clamp(48px,6.5vw,100px);
  font-weight:300;
  color:#2c2c2c;
  letter-spacing:2px;
  line-height:1;
}
.date-display{
  font-family:'Lato',sans-serif;
  font-size:clamp(14px,1.6vw,24px);
  color:#666;
  font-weight:300;
  margin-top:6px;
  letter-spacing:0.5px;
}

/* Wetter-Bereich */
.weather-main-card{
  display:flex;
  align-items:center;
  gap:2vw;
  padding:2.5vh 2vw;
  border-radius:20px;
  background:rgba(255,255,255,0.6);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.85);
  box-shadow:0 4px 30px rgba(0,0,0,0.05);
}

.weather-icon-big{
  flex-shrink:0;
  width:clamp(64px,7vw,110px);
  height:clamp(64px,7vw,110px);
}

.weather-temp-block{}
.temp-main{
  font-family:'Lato',sans-serif;
  font-size:clamp(44px,6vw,90px);
  font-weight:300;
  color:#2c2c2c;
  line-height:1;
}
.temp-desc{
  font-size:clamp(14px,1.6vw,22px);
  color:#666;
  font-weight:300;
  margin-top:4px;
  letter-spacing:0.5px;
}
.temp-feels{
  font-size:clamp(12px,1.2vw,18px);
  color:#999;
  margin-top:4px;
}

.weather-wind{
  margin-left:auto;
  text-align:right;
  display:flex;flex-direction:column;gap:8px;
}
.wind-item{
  font-size:clamp(12px,1.3vw,20px);
  color:#666;
  display:flex;align-items:center;gap:8px;justify-content:flex-end;
}
.wind-icon{font-size:1.3em}

/* 4-Tage Vorhersage */
.forecast-card{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1.5vw;
}

.forecast-day{
  background:rgba(255,255,255,0.55);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.8);
  border-radius:16px;
  padding:1.5vh 0.8vw;
  display:flex;flex-direction:column;
  align-items:center;gap:0.8vh;
  box-shadow:0 2px 15px rgba(0,0,0,0.04);
}
.fc-day-name{
  font-size:clamp(12px,1.3vw,20px);
  font-weight:700;
  color:#444;
  letter-spacing:1px;
  text-transform:uppercase;
}
.fc-icon{width:clamp(28px,3.2vw,50px);height:clamp(28px,3.2vw,50px)}
.fc-hi{
  font-size:clamp(14px,1.5vw,22px);
  font-weight:700;color:#2c2c2c;
}
.fc-lo{
  font-size:clamp(11px,1.2vw,18px);
  font-weight:300;color:#888;
}

/* Ort-Info */
.location-badge{
  margin-top:auto;
  display:flex;align-items:center;gap:10px;
  font-size:clamp(12px,1.2vw,18px);
  color:#888;
  font-weight:300;
}
.loc-dot{
  width:8px;height:8px;
  border-radius:50%;
  background:#4a5e35;
  opacity:0.7;
}

/* Wetter-Status-Indikator */
.weather-status{
  display:flex;align-items:center;gap:8px;
  font-size:clamp(10px,1vw,15px);
  color:#aaa;
}
.status-dot{
  width:6px;height:6px;border-radius:50%;
  background:#4a5e35;
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:0.4;transform:scale(0.8)}
}
</style>
</head>

// ===== DATUM & UHRZEIT =====
const DAYS = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const DAYS_SHORT = ['SO','MO','DI','MI','DO','FR','SA'];
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

function updateClock(){
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('timeDisplay').textContent = h + ':' + m;
  document.getElementById('dateDisplay').textContent =
    DAYS[now.getDay()] + ', ' + now.getDate() + '. ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear();

  // Analoge Uhr-Zeiger
  const s = now.getSeconds();
  const mi = now.getMinutes() + s/60;
  const ho = (now.getHours() % 12) + mi/60;
  const minAngle = mi * 6 - 90;
  const hourAngle = ho * 30 - 90;
  const cx=40, cy=40, r_min=26, r_hour=18;
  document.getElementById('minHand').setAttribute('x2', cx + r_min*Math.cos(minAngle*Math.PI/180));
  document.getElementById('minHand').setAttribute('y2', cy + r_min*Math.sin(minAngle*Math.PI/180));
  document.getElementById('hourHand').setAttribute('x2', cx + r_hour*Math.cos(hourAngle*Math.PI/180));
  document.getElementById('hourHand').setAttribute('y2', cy + r_hour*Math.sin(hourAngle*Math.PI/180));
}
setInterval(updateClock, 1000);
updateClock();

// ===== WETTER-ICONS (WMO Codes) =====
function getWeatherSVG(code, size){
  size = size||80;
  // Sonnig
  if(code===0){
    return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">

      <g stroke="#f5c842" stroke-width="${size*0.04}" stroke-linecap="round">
        <line x1="${size/2}" y1="${size*0.08}" x2="${size/2}" y2="${size*0.03}"/>

  // Bewölkt / bedeckt
  if(code===3){
    return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="${size*0.55}" cy="${size*0.4}" rx="${size*0.28}" ry="${size*0.18}" fill="#b8c8ce"/>
      <ellipse cx="${size*0.4}" cy="${size*0.46}" rx="${size*0.22}" ry="${size*0.16}" fill="#c8d8de"/>
      <ellipse cx="${size*0.65}" cy="${size*0.48}" rx="${size*0.2}" ry="${size*0.14}" fill="#c0d0d7"/>
      <ellipse cx="${size*0.52}" cy="${size*0.54}" rx="${size*0.36}" ry="${size*0.15}" fill="#baccda"/>
      <ellipse cx="${size*0.35}" cy="${size*0.52}" rx="${size*0.18}" ry="${size*0.13}" fill="#d0dde4"/></svg>`;
  }
  // Regen
  if((code>=51&&code<=67)||(code>=80&&code<=82)){
    return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="${size*0.52}" cy="${size*0.36}" rx="${size*0.26}" ry="${size*0.16}" fill="#98a8b0"/>
      <ellipse cx="${size*0.38}" cy="${size*0.42}" rx="${size*0.2}" ry="${size*0.14}" fill="#a8b8be"/>

        <line x1="${size*0.3}" y1="${size*0.68}" x2="${size*0.25}" y2="${size*0.8}"/>

        <line x1="${size*0.72}" y1="${size*0.65}" x2="${size*0.67}" y2="${size*0.77}"/>
      </g></svg>`;
  }
  // Schnee
  if(code>=71&&code<=77){
    return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="${size*0.52}" cy="${size*0.38}" rx="${size*0.26}" ry="${size*0.16}" fill="#c8d8e8"/>

      <g fill="#90b0d0">
        <circle cx="${size*0.3}" cy="${size*0.72}" r="${size*0.04}"/>
        <circle cx="${size*0.45}" cy="${size*0.76}" r="${size*0.035}"/>
        <circle cx="${size*0.6}" cy="${size*0.73}" r="${size*0.04}"/>
        <circle cx="${size*0.72}" cy="${size*0.77}" r="${size*0.035}"/>

      <polygon points="${size*0.52},${size*0.55} ${size*0.42},${size*0.72} ${size*0.5},${size*0.7} ${size*0.44},${size*0.88} ${size*0.6},${size*0.67} ${size*0.5},${size*0.7}" fill="#f5c842"/></svg>`;
  }
  // Default: Wolke
  return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="${size*0.52}" cy="${size*0.42}" rx="${size*0.26}" ry="${size*0.17}" fill="#b8c8ce"/>
    <ellipse cx="${size*0.38}" cy="${size*0.48}" rx="${size*0.2}" ry="${size*0.15}" fill="#c8d8de"/>
    <ellipse cx="${size*0.62}" cy="${size*0.5}" rx="${size*0.19}" ry="${size*0.14}" fill="#c0d0d7"/>
    <ellipse cx="${size*0.5}" cy="${size*0.56}" rx="${size*0.35}" ry="${size*0.14}" fill="#baccda"/>
  </svg>`;
}

function getWeatherDesc(code){
  if(code===0) return 'Sonnig';
  if(code===1) return 'Meist sonnig';
  if(code===2) return 'Teilweise bewölkt';
  if(code===3) return 'Bedeckt';
  if(code>=45&&code<=48) return 'Neblig';
  if(code>=51&&code<=57) return 'Nieselregen';
  if(code>=61&&code<=67) return 'Regen';
  if(code>=71&&code<=77) return 'Schnee';
  if(code>=80&&code<=82) return 'Regenschauer';
  if(code>=85&&code<=86) return 'Schneeschauer';
  if(code>=95&&code<=99) return 'Gewitter';
  return 'Bewölkt';
}

// ===== WETTER LADEN =====
async function loadWeather(){
  try {
    const r = await fetch(OPENWEATHER_URL);
    const d = await r.json();
    const c = d.current;
    const daily = d.daily;

    // Aktuelle Werte setzen
    document.getElementById('tempValue').textContent = Math.round(c.temperature_2m);
    document.getElementById('tempDesc').textContent = getWeatherDesc(c.weather_code);
    document.getElementById('tempFeels').textContent = 'Gefühlt: ' + Math.round(c.apparent_temperature) + '°C';
    document.getElementById('windSpeed').textContent = Math.round(c.wind_speed_10m) + ' km/h';
    document.getElementById('humidity').textContent = Math.round(c.relative_humidity_2m) + '%';
    document.getElementById('weatherIconBig').innerHTML = getWeatherSVG(c.weather_code, 100);

    const now = new Date();
    document.getElementById('lastUpdate').textContent = 'Stand: ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

    // Vorhersage (Mo–Do, 4 Tage ab morgen)
    const fc = document.getElementById('forecastCard');
    fc.innerHTML = '';
    const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
    for(let i=1;i<=4;i++){
      const dt = new Date(); dt.setDate(dt.getDate()+i);
      const dayShort = DAYS_SHORT[dt.getDay()];
      const code = daily.weather_code[i];
      const hi = Math.round(daily.temperature_2m_max[i]);
      const lo = Math.round(daily.temperature_2m_min[i]);
      fc.innerHTML += `<div class="forecast-day">
        <div class="fc-day-name">${dayShort}</div>
        <div class="fc-icon">${getWeatherSVG(code, 44)}</div>
        <div class="fc-hi">${hi}°</div>
        <div class="fc-lo">${lo}°</div>
      </div>`;
    }
  } catch(e){
    console.log('Wetter-Ladefehler:', e);
    // Fallback-Anzeige bleibt
  }
}

loadWeather();
setInterval(loadWeather, 30*60*1000); // alle 30 Min
