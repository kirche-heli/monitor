name: iCal Feed aktualisieren

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: iCal laden
        run: |
          curl -sL --max-time 15 --user-agent "Mozilla/5.0" \
            "https://api2.churchdesk.com/ical/parish/67323?organizationId=5801" \
            -o kalender_raw.ics
          grep -q "BEGIN:VCALENDAR" kalender_raw.ics && echo "OK" || (cat kalender_raw.ics && exit 1)

      - name: UTC nach Europe/Berlin umrechnen
        run: python3 convert.py

      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f kalender.ics
          git diff --staged --quiet && echo "Keine Aenderungen" || git commit -m "kalender.ics: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
